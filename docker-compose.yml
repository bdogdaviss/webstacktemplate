services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webstackdb
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/webstackdb
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pg-data:
  redis-data:
